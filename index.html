<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Academy — أتقن الأمن السيبراني وابنِ مستقبلك المهني</title>
    <meta
      name="description"
      content="أكاديمية Cyber Academy لتعليم الأمن السيبراني من الصفر حتى الاحتراف باللغتين العربية والإنجليزية، مع 61 دورة تدريبية، دروس تطبيقية، اختبارات، شهادات، ونظام اشتراكات تفاعلي."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cyber Academy — أتقن الأمن السيبراني وابنِ مستقبلك المهني" />
    <meta
      property="og:description"
      content="منصة تعليمية احترافية ثنائية اللغة للأمن السيبراني تغطي المسار المبتدئ المجاني والمتوسط والمتقدم."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-base: #060913;
        --bg-surface: #0b1120;
        --bg-elevated: #0f172a;
        --bg-glass: rgba(11, 17, 32, 0.85);
        --border-subtle: rgba(148, 163, 184, 0.16);
        --border-strong: rgba(59, 130, 246, 0.45);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --blue: #3b82f6;
        --blue-hover: #2563eb;
        --cyan: #22d3ee;
        --violet: #8b5cf6;
        --emerald: #10b981;
        --amber: #f59e0b;
        --rose: #f43f5e;
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 20px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg-base);
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -15%, rgba(59, 130, 246, 0.16), transparent),
          radial-gradient(ellipse 50% 40% at 85% 20%, rgba(139, 92, 246, 0.1), transparent),
          linear-gradient(to bottom, rgba(15, 23, 42, 0.25) 1px, transparent 1px),
          linear-gradient(to right, rgba(15, 23, 42, 0.25) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
        color: var(--text-primary);
        font-family: 'Cairo', 'Outfit', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      html[dir='ltr'] body {
        font-family: 'Outfit', 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      select,
      textarea {
        font-family: inherit;
      }

      .container {
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* Header */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 40;
        border-bottom: 1px solid var(--border-subtle);
        background: rgba(6, 9, 19, 0.88);
        backdrop-filter: blur(14px);
      }

      .header-inner {
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        background: none;
        border: none;
        color: var(--text-primary);
        padding: 0;
        flex-shrink: 0;
      }

      .brand-title {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff 30%, #60a5fa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .nav-btn {
        background: transparent;
        border: 1px solid transparent;
        color: var(--text-secondary);
        font-size: 0.9rem;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all 0.18s ease;
        white-space: nowrap;
      }

      .nav-btn:hover {
        color: var(--text-primary);
        background: rgba(148, 163, 184, 0.08);
      }

      .nav-btn.active {
        color: #93c5fd;
        background: rgba(59, 130, 246, 0.12);
        border-color: rgba(59, 130, 246, 0.3);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .mobile-menu-btn {
        display: none;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        color: var(--text-primary);
        width: 40px;
        height: 40px;
        border-radius: var(--radius-sm);
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: var(--radius-sm);
        font-weight: 700;
        font-size: 0.88rem;
        padding: 10px 18px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.18s ease;
        white-space: nowrap;
      }

      .btn-sm {
        padding: 7px 13px;
        font-size: 0.8rem;
      }

      .btn-lg {
        padding: 13px 24px;
        font-size: 0.96rem;
        border-radius: 12px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: #fff;
        box-shadow: 0 8px 24px -6px rgba(37, 99, 235, 0.5);
      }

      .btn-primary:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }

      .btn-emerald {
        background: linear-gradient(135deg, #059669, #10b981);
        color: #fff;
        box-shadow: 0 8px 24px -6px rgba(16, 185, 129, 0.4);
      }

      .btn-emerald:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .btn-outline {
        background: rgba(15, 23, 42, 0.75);
        border-color: rgba(148, 163, 184, 0.28);
        color: var(--text-primary);
      }

      .btn-outline:hover {
        border-color: rgba(59, 130, 246, 0.6);
        background: rgba(30, 41, 59, 0.9);
      }

      .btn-danger-outline {
        background: rgba(244, 63, 94, 0.1);
        border-color: rgba(244, 63, 94, 0.35);
        color: #fda4af;
      }

      .btn-danger-outline:hover {
        background: rgba(244, 63, 94, 0.2);
      }

      /* Badges */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .badge-free {
        background: rgba(16, 185, 129, 0.14);
        border-color: rgba(16, 185, 129, 0.35);
        color: #6ee7b7;
      }

      .badge-paid {
        background: rgba(245, 158, 11, 0.14);
        border-color: rgba(245, 158, 11, 0.35);
        color: #fcd34d;
      }

      .badge-pro {
        background: rgba(59, 130, 246, 0.16);
        border-color: rgba(59, 130, 246, 0.42);
        color: #93c5fd;
      }

      .badge-violet {
        background: rgba(139, 92, 246, 0.15);
        border-color: rgba(139, 92, 246, 0.38);
        color: #c4b5fd;
      }

      /* Cards & Layout */
      .section {
        padding: 64px 0;
      }

      .section-tight {
        padding: 40px 0;
      }

      .card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 24px;
        transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      }

      .card-hover:hover {
        border-color: var(--border-strong);
        transform: translateY(-3px);
        box-shadow: 0 18px 40px -15px rgba(37, 99, 235, 0.25);
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }

      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
      }

      /* Hero */
      .hero {
        padding: 56px 0 64px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.12fr 0.88fr;
        gap: 40px;
        align-items: center;
      }

      .hero-title {
        font-size: clamp(2rem, 4vw, 3.25rem);
        font-weight: 800;
        line-height: 1.18;
        margin: 16px 0 16px;
        letter-spacing: -0.02em;
      }

      .hero-gradient {
        background: linear-gradient(120deg, #60a5fa 0%, #22d3ee 48%, #a78bfa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .hero-subtitle {
        color: var(--text-secondary);
        font-size: 1.05rem;
        max-width: 600px;
        margin: 0 0 28px;
      }

      .hero-ctas {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 28px;
      }

      .stats-bar {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .stat-box {
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .stat-value {
        font-size: 1.35rem;
        font-weight: 800;
        color: #fff;
        line-height: 1.2;
      }

      .stat-label {
        font-size: 0.76rem;
        color: var(--text-secondary);
        margin-top: 2px;
      }

      .hero-visual {
        background: linear-gradient(160deg, rgba(15, 23, 42, 0.92), rgba(11, 17, 32, 0.96));
        border: 1px solid rgba(59, 130, 246, 0.35);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: 0 24px 60px -15px rgba(37, 99, 235, 0.25);
        position: relative;
        overflow: hidden;
      }

      /* Form Inputs */
      .input,
      .select,
      .textarea {
        width: 100%;
        background: #060a14;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        color: var(--text-primary);
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.15s ease;
      }

      .input:focus,
      .select:focus,
      .textarea:focus {
        border-color: var(--blue);
      }

      /* Course Card */
      .course-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 14px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 20px;
        transition: all 0.2s ease;
      }

      .course-card:hover {
        border-color: var(--border-strong);
        transform: translateY(-2px);
      }

      .course-title {
        font-size: 1.05rem;
        font-weight: 700;
        color: #fff;
        margin: 8px 0 6px;
      }

      .course-desc {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Filter Bar */
      .filter-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tab-pill {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .tab-pill:hover {
        color: #fff;
        border-color: rgba(148, 163, 184, 0.4);
      }

      .tab-pill.active {
        background: rgba(59, 130, 246, 0.18);
        border-color: var(--blue);
        color: #fff;
      }

      /* Modals */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(2, 6, 23, 0.82);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow-y: auto;
      }

      .modal-panel {
        width: 100%;
        max-width: 540px;
        background: #0b1120;
        border: 1px solid rgba(59, 130, 246, 0.35);
        border-radius: var(--radius-lg);
        padding: 26px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65);
        position: relative;
        max-height: 92vh;
        overflow-y: auto;
      }

      .modal-panel.wide {
        max-width: 820px;
      }

      .modal-close {
        position: absolute;
        top: 16px;
        inset-inline-end: 16px;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
      }

      .modal-close:hover {
        color: #fff;
        border-color: rgba(148, 163, 184, 0.5);
      }

      /* Code terminal block */
      .terminal-box {
        background: #030712;
        border: 1px solid rgba(59, 130, 246, 0.3);
        border-radius: 12px;
        overflow: hidden;
        direction: ltr;
        text-align: left;
      }

      .terminal-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: #0f172a;
        border-bottom: 1px solid var(--border-subtle);
        font-size: 0.75rem;
        color: var(--text-secondary);
      }

      .terminal-pre {
        margin: 0;
        padding: 14px;
        overflow-x: auto;
        font-size: 0.82rem;
        color: #7dd3fc;
      }

      /* FAQ */
      .faq-item {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        overflow: hidden;
      }

      .faq-q {
        width: 100%;
        background: transparent;
        border: none;
        padding: 18px 20px;
        color: #fff;
        font-weight: 700;
        font-size: 0.96rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        text-align: start;
      }

      .faq-a {
        padding: 0 20px 18px;
        color: var(--text-secondary);
        font-size: 0.9rem;
      }

      /* Toast */
      .toast-container {
        position: fixed;
        bottom: 22px;
        inset-inline-end: 22px;
        z-index: 80;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 360px;
      }

      .toast {
        background: #0f172a;
        border: 1px solid rgba(16, 185, 129, 0.55);
        color: #ecfdf5;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 0.86rem;
        font-weight: 600;
        box-shadow: 0 16px 35px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        gap: 10px;
        animation: slideUp 0.2s ease;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Pricing Highlight */
      .pricing-pro {
        background: linear-gradient(180deg, rgba(30, 58, 138, 0.28) 0%, rgba(11, 17, 32, 0.98) 100%);
        border: 1.5px solid rgba(59, 130, 246, 0.72);
        box-shadow: 0 22px 60px -18px rgba(59, 130, 246, 0.35);
      }

      /* Certificate */
      .cert-frame {
        border: 2px solid rgba(59, 130, 246, 0.55);
        background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.14), rgba(11, 17, 32, 0.98));
        border-radius: 18px;
        padding: 28px;
        text-align: center;
      }

      /* Footer */
      .site-footer {
        border-top: 1px solid var(--border-subtle);
        background: #04070f;
        padding: 48px 0 28px;
        margin-top: 64px;
      }

      /* Responsive */
      @media (max-width: 960px) {
        .hero-grid,
        .grid-3,
        .grid-4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .hero-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 760px) {
        .nav-links {
          display: none;
        }
        .mobile-menu-btn {
          display: inline-flex;
        }
        .grid-2,
        .grid-3,
        .grid-4,
        .stats-bar {
          grid-template-columns: 1fr;
        }
        .hide-mobile {
          display: none;
        }
      }

      .mobile-drawer {
        border-top: 1px solid var(--border-subtle);
        background: var(--bg-surface);
        padding: 14px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-container"></div>

    <script>
      (function () {
        'use strict';

        /* ============================
           1. STORAGE & INITIAL STATE
        ============================ */
        var STORAGE_KEY = 'cyber_academy_singlefile_v1';
        var memoryFallback = null;

        function defaultState() {
          return {
            lang: 'ar',
            page: 'home',
            levelFilter: 'all',
            categoryFilter: 'all',
            searchQuery: '',
            onlyFavorites: false,
            user: null,
            users: [
              {
                id: 1,
                email: 'othmanjamal92@gmail.com',
                fullName: 'عثمان جمال',
                role: 'admin',
                points: 240,
                streak: 5,
              },
              {
                id: 2,
                email: 'student@cyberacademy.demo',
                fullName: 'سارة أحمد — متعلمة',
                role: 'student',
                points: 90,
                streak: 2,
              },
            ],
            subscription: {
              plan: 'free',
              status: 'active',
              cancelAtPeriodEnd: false,
              periodEnd: null,
            },
            payments: [],
            completedCourses: [],
            completedLessons: [],
            favorites: [],
            quizAttempts: [],
            certificates: [],
            contactMessages: [],
            openFaqIndex: 0,
            mobileMenuOpen: false,
          };
        }

        function loadState() {
          try {
            var raw = window.localStorage.getItem(STORAGE_KEY);
            if (raw) {
              var parsed = JSON.parse(raw);
              return Object.assign(defaultState(), parsed);
            }
          } catch (e) {}
          if (!memoryFallback) memoryFallback = defaultState();
          return memoryFallback;
        }

        var state = loadState();

        function saveState() {
          memoryFallback = state;
          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (e) {}
        }

        function applyLangDirection() {
          document.documentElement.lang = state.lang;
          document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
          document.title =
            state.lang === 'ar'
              ? 'Cyber Academy — أتقن الأمن السيبراني وابنِ مستقبلك المهني'
              : 'Cyber Academy — Master Cybersecurity & Build Your Career';
        }

        function showToast(msg) {
          var root = document.getElementById('toast-root');
          if (!root) return;
          var el = document.createElement('div');
          el.className = 'toast';
          el.innerHTML = '<span>✓</span><span>' + escapeHtml(msg) + '</span>';
          root.appendChild(el);
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 3600);
        }

        function escapeHtml(str) {
          return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function hasPremium() {
          return state.subscription && state.subscription.plan === 'premium' && state.subscription.status === 'active';
        }

        /* ============================
           2. BILINGUAL DICTIONARY
        ============================ */
        var COPY = {
          ar: {
            navHome: 'الرئيسية',
            navCourses: 'الدورات',
            navPricing: 'الأسعار والاشتراكات',
            navDashboard: 'لوحة الطالب',
            navVerify: 'تحقق من شهادة',
            navContact: 'تواصل معنا',
            login: 'تسجيل الدخول',
            register: 'إنشاء حساب',
            logout: 'تسجيل الخروج',
            switchLang: 'EN',
            heroBadge: 'منصة تعليمية شاملة للأمن السيبراني · 61 دورة منظمة',
            heroTitle1: 'أتقن الأمن السيبراني',
            heroTitle2: 'وابنِ مستقبلك المهني',

          document.getElementById('btn-copy-code').onclick = function () {
            if (navigator.clipboard) navigator.clipboard.writeText(course.code).catch(function () {});
            showToast(isAr ? 'تم نسخ الأمر بنجاح' : 'Command copied to clipboard');
          };

          document.getElementById('form-course-quiz').onsubmit = function (e) {
            e.preventDefault();
            var selected = document.querySelector('input[name="qopt"]:checked');
            if (!selected) return;
            var chosen = Number(selected.value);
            var resBox = document.getElementById('quiz-result-box');

            if (chosen === course.quiz.correctIdx) {
              if (state.completedCourses.indexOf(course.id) === -1) {
                state.completedCourses.push(course.id);
              }
              var existingCert = state.certificates.find(function (ct) {
                return ct.courseId === course.id;
              });
              if (!existingCert) {
                var codeStr = 'CYB-' + course.id + '-' + Math.random().toString(16).slice(2, 8).toUpperCase();
                existingCert = {
                  courseId: course.id,
                  code: codeStr,
                  recipient: (state.user && state.user.fullName) || (isAr ? 'متعلم Cyber Academy' : 'Cyber Academy Learner'),
                  titleAr: course.titleAr,
                  titleEn: course.titleEn,
                  score: 100,
                  date: new Date().toLocaleDateString(),
                };
                state.certificates.unshift(existingCert);
              }
              saveState();
              renderApp();
              resBox.innerHTML =
                '<div style="padding:12px;border-radius:10px;background:rgba(16,185,129,0.14);border:1px solid rgba(16,185,129,0.4);font-size:0.86rem;color:#6ee7b7;">' +
                '✓ ' +
                escapeHtml(isAr ? 'إجابة صحيحة! تم إتمام الدورة وإصدار شهادتك: ' : 'Correct! Course completed & certificate issued: ') +
                '<strong class="mono">' +
                escapeHtml(existingCert.code) +
                '</strong></div>';
              showToast(isAr ? 'تم إصدار شهادتك بنجاح!' : 'Certificate issued successfully!');
            } else {
              resBox.innerHTML =
                '<div style="padding:10px;border-radius:10px;background:rgba(244,63,94,0.14);border:1px solid rgba(244,63,94,0.4);font-size:0.84rem;color:#fda4af;">' +
                escapeHtml(isAr ? 'إجابة غير صحيحة، حاول اختيار الإجابة الأدق أمنياً.' : 'Not quite right — review the lesson and try again.') +
                '</div>';
            }
          };
        }

        function openAuthModal(mode) {
          var isAr = state.lang === 'ar';
          var mr = document.getElementById('modal-root');
          if (!mr) return;
          var isReg = mode === 'register';

          mr.innerHTML =
            '<div class="modal-backdrop" id="modal-backdrop">' +
            '<div class="modal-panel">' +
            '<button type="button" class="modal-close" id="btn-close-modal">✕</button>' +
            '<h2 style="margin:0 0 6px;font-size:1.35rem;font-weight:800;">' +
            escapeHtml(isReg ? t('register') : t('login')) +
            '</h2><p style="font-size:0.84rem;color:var(--text-secondary);margin:0 0 18px;">' +
            escapeHtml(isAr ? 'سجّل الدخول لحفظ تقدمك وشهاداتك، أو جرّب الدخول السريع للمعاينة.' : 'Sign in to save your courses & certificates, or use 1-Click Demo Login.') +
            '</p>' +
            '<button type="button" class="btn btn-emerald" id="btn-demo-login" style="width:100%;margin-bottom:14px;">⚡ ' +
            escapeHtml(isAr ? 'دخول سريع للمعاينة (طالب تجريبي)' : '1-Click Instant Demo Login') +
            '</button>' +
            '<form id="form-auth-local" style="display:flex;flex-direction:column;gap:12px;">' +
            (isReg
              ? '<input type="text" id="a-name" class="input" required placeholder="' +
                escapeHtml(isAr ? 'الاسم الكامل' : 'Full Name') +
                '"/>'
              : '') +
            '<input type="email" id="a-email" class="input" dir="ltr" required placeholder="name@example.com"/>' +
            '<input type="password" id="a-pass" class="input" dir="ltr" required placeholder="' +
            escapeHtml(isAr ? 'كلمة المرور' : 'Password') +
            '"/>' +
            '<button type="submit" class="btn btn-primary" style="width:100%;">' +
            escapeHtml(isReg ? t('register') : t('login')) +
            '</button></form></div></div>';

          document.getElementById('btn-close-modal').onclick = closeModal;
          document.getElementById('modal-backdrop').onclick = function (e) {
            if (e.target.id === 'modal-backdrop') closeModal();
          };
          document.getElementById('btn-demo-login').onclick = function () {
            state.user = state.users[1];
            saveState();
            closeModal();
            renderApp();
            showToast(isAr ? 'تم تسجيل الدخول بالحساب التجريبي' : 'Signed in as Demo Student');
          };
          document.getElementById('form-auth-local').onsubmit = function (e) {
            e.preventDefault();
            var email = document.getElementById('a-email').value.trim().toLowerCase();
            var nameEl = document.getElementById('a-name');
            var fullName = nameEl ? nameEl.value.trim() : email.split('@')[0];
            state.user = {
              id: Date.now(),
              email: email,
              fullName: fullName || 'Learner',
              role: email === 'othmanjamal92@gmail.com' ? 'admin' : 'student',
              points: 50,
              streak: 1,
            };
            saveState();
            closeModal();
            renderApp();
            showToast(isAr ? 'مرحباً بك في Cyber Academy!' : 'Welcome to Cyber Academy!');
          };
        }

        /* ============================
           7. MAIN RENDER & EVENT BINDING
        ============================ */
        function renderApp() {
          applyLangDirection();
          var app = document.getElementById('app');
          if (!app) return;

          var mainHtml = '';
          if (state.page === 'courses') mainHtml = renderCoursesPage();
          else if (state.page === 'pricing') mainHtml = renderPricingPage();
          else if (state.page === 'dashboard') mainHtml = renderDashboardPage();
          else if (state.page === 'verify') mainHtml = renderVerifyPage(state.verifyPrefill || '');
          else if (state.page === 'contact') mainHtml = renderContactPage();
          else mainHtml = renderHomePage();

          app.innerHTML = renderHeader() + '<main>' + mainHtml + '</main>' + renderFooter();
          bindEvents();
        }

        function bindEvents() {
          document.querySelectorAll('[data-nav]').forEach(function (el) {
            el.addEventListener('click', function () {
              state.page = el.getAttribute('data-nav');
              state.mobileMenuOpen = false;
              saveState();
              renderApp();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            });
          });

          document.querySelectorAll('[data-nav-level]').forEach(function (el) {
            el.addEventListener('click', function () {
              state.page = 'courses';
              state.levelFilter = el.getAttribute('data-nav-level') || 'all';
              state.mobileMenuOpen = false;
              saveState();
              renderApp();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            });
          });

          document.querySelectorAll('[data-open-checkout]').forEach(function (el) {
            el.addEventListener('click', function () {
              openCheckoutModal();
            });
          });

          document.querySelectorAll('[data-open-course]').forEach(function (el) {
            el.addEventListener('click', function () {
              openCourseModal(Number(el.getAttribute('data-open-course')));
            });
          });

          document.querySelectorAll('[data-open-auth]').forEach(function (el) {
            el.addEventListener('click', function () {
              openAuthModal(el.getAttribute('data-open-auth'));
            });
          });

          document.querySelectorAll('[data-fav]').forEach(function (el) {
            el.addEventListener('click', function () {
              var id = Number(el.getAttribute('data-fav'));
              var idx = state.favorites.indexOf(id);
              if (idx === -1) state.favorites.push(id);
              else state.favorites.splice(idx, 1);
              saveState();
              renderApp();
            });
          });

          var langBtn = document.getElementById('btn-lang-toggle');
          if (langBtn) {
            langBtn.onclick = function () {
              state.lang = state.lang === 'ar' ? 'en' : 'ar';
              saveState();
              renderApp();
            };
          }

          var mobBtn = document.getElementById('btn-mobile-menu');
          if (mobBtn) {
            mobBtn.onclick = function () {
              state.mobileMenuOpen = !state.mobileMenuOpen;
              renderApp();
            };
          }

          ['btn-logout', 'btn-logout-mobile'].forEach(function (id) {
            var b = document.getElementById(id);
            if (b) {
              b.onclick = function () {
                state.user = null;
                saveState();
                renderApp();
              };
            }
          });

          document.querySelectorAll('[data-filter-level]').forEach(function (el) {
            el.addEventListener('click', function () {
              state.levelFilter = el.getAttribute('data-filter-level');
              saveState();
              renderApp();
            });
          });

          var favFilterBtn = document.getElementById('btn-filter-fav');
          if (favFilterBtn) {
            favFilterBtn.onclick = function () {
              state.onlyFavorites = !state.onlyFavorites;
              saveState();
              renderApp();
            };
          }

          var searchInput = document.getElementById('input-course-search');
          if (searchInput) {
            searchInput.oninput = function (e) {
              state.searchQuery = e.target.value;
              var caretPos = e.target.selectionStart;
              saveState();
              renderApp();
              var nextInput = document.getElementById('input-course-search');
              if (nextInput) {
                nextInput.focus();
                if (typeof caretPos === 'number') nextInput.setSelectionRange(caretPos, caretPos);
              }
            };
          }

          var catSelect = document.getElementById('select-course-cat');
          if (catSelect) {
            catSelect.onchange = function (e) {
              state.categoryFilter = e.target.value;
              saveState();
              renderApp();
            };
          }

          var resetFiltersBtn = document.getElementById('btn-reset-filters');
          if (resetFiltersBtn) {
            resetFiltersBtn.onclick = function () {
              state.levelFilter = 'all';
              state.categoryFilter = 'all';
              state.searchQuery = '';
              state.onlyFavorites = false;
              saveState();
              renderApp();
            };
          }

          var cancelRenBtn = document.getElementById('btn-cancel-renewal');
          if (cancelRenBtn) {
            cancelRenBtn.onclick = function () {
              state.subscription.cancelAtPeriodEnd = true;
              saveState();
              renderApp();
              showToast(state.lang === 'ar' ? 'تم جدولة إلغاء التجديد التجريبي' : 'Mock renewal cancellation scheduled');
            };
          }

          var downgradeBtn = document.getElementById('btn-downgrade-free');
          if (downgradeBtn) {
            downgradeBtn.onclick = function () {
              state.subscription = { plan: 'free', status: 'canceled', cancelAtPeriodEnd: false, periodEnd: null };
              saveState();
              renderApp();
              showToast(state.lang === 'ar' ? 'تم إرجاع الحساب للخطة المجانية' : 'Reverted to Starter Free plan');
            };
          }

          document.querySelectorAll('[data-faq]').forEach(function (el) {
            el.addEventListener('click', function () {
              var idx = Number(el.getAttribute('data-faq'));
              state.openFaqIndex = state.openFaqIndex === idx ? -1 : idx;
              renderApp();
            });
          });

          var verifyForm = document.getElementById('form-verify-cert');
          if (verifyForm) {
            verifyForm.onsubmit = function (e) {
              e.preventDefault();
              state.verifyPrefill = document.getElementById('input-verify-code').value.trim();
              renderApp();
            };
          }

          document.querySelectorAll('[data-verify-code]').forEach(function (el) {
            el.addEventListener('click', function () {
              state.verifyPrefill = el.getAttribute('data-verify-code');
              state.page = 'verify';
              saveState();
              renderApp();
            });
          });

          var contactForm = document.getElementById('form-contact');
          if (contactForm) {
            contactForm.onsubmit = function (e) {
              e.preventDefault();
              state.contactMessages.unshift({
                name: document.getElementById('c-name').value.trim(),
                email: document.getElementById('c-email').value.trim(),
                subject: document.getElementById('c-subject').value.trim(),
                message: document.getElementById('c-msg').value.trim(),
                at: new Date().toISOString(),
              });
              saveState();
              contactForm.reset();
              showToast(state.lang === 'ar' ? 'تم استلام رسالتك بنجاح' : 'Message sent successfully');
            };
          }
        }

        var initialPath = window.location.pathname || '/';
        if (initialPath.indexOf('/pricing') === 0) state.page = 'pricing';
        else if (initialPath.indexOf('/courses') === 0) state.page = 'courses';
        else if (initialPath.indexOf('/dashboard') === 0) state.page = 'dashboard';
        else if (initialPath.indexOf('/verify') === 0) state.page = 'verify';
        else if (initialPath.indexOf('/contact') === 0) state.page = 'contact';

        renderApp();
      })();
    </script>
  </body>
</html>
